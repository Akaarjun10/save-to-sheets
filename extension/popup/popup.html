<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick save to Google Sheets</title><link rel="stylesheet" href="../styles/app.css"><script type="module" src="popup.js"></script></head>
<body class="popup"><main class="popup-main"><header class="topbar popup-topbar"><div><p class="eyebrow">SAVE TO SHEETS</p><h1>Quick save</h1></div><label class="theme-switch"><input id="theme-toggle" type="checkbox"><span>Dark</span></label></header>
<div id="message" class="notice" role="status"></div><label class="field"><span>Save to</span><select id="destination"></select></label><label class="field"><span>Text, link, or page URL</span><textarea id="text" rows="3" maxlength="5000" placeholder="Paste something to save"></textarea></label><label class="field"><span>Note (optional)</span><input id="note" maxlength="200" placeholder="Add a note"></label><div class="button-row"><button id="save" class="primary">Save</button><button id="open-settings" type="button">Settings</button></div>
<section class="card compact"><h2>Recent demo saves</h2><div id="recent" class="preview-list"></div></section></main></body></html>
